name: KB Ingest

on:
  workflow_dispatch:
  push:
    paths:
      - 'knowledge_base/sources/**.pdf'

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run KB ingest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run ingest:kb

      - name: Commit extracted JSON back (optional)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add knowledge_base/extracted/*.json src/data/customKnowledgeBase.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Automated KB ingest: add extracted JSON and merged DB"
            git push
          fi
